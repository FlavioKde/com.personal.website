name: Deploy front to hosting

on:
  push:
    branches: 
      - main

jobs: 
  build-and-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name : Setup node
          uses : actions/setup-node@v4
          with : 
            node-version : '20'

        - name : Install dependencies
          run : npm ci

        - name : Build
          run : npm run build

        - name : Deploy via FTP
          uses: SamKirkland/FTP-Deploy-Action@v4.3.4
          with:
           server: ${{ secrets.FTP_HOST }}
           username: ${{ secrets.FTP_USER }}
           password: ${{ secrets.FTP_PASS }}
           port: 21
           protocol: ftps
           local-dir: dist/
           server-dir: ./public_html/

           state-name: .ftp-deploy-frontend.json

           dangerous-clean-slate: false
           
           exclude: |
           
             backend/**

             .well-known/**
    
             .htaccess
             .htpasswd
             .user.ini
             .env
             config.php
             database.php
             *.log
          
             .ftp-deploy-*.json
             .git/
            
             *.php
              cgi-bin/**
          
           log-level: verbose
           security: strict
           
          
